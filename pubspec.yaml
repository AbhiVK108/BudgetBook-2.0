name: budget_book_2026
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^11.0.0
  icons_launcher: 3.0.3
  image: 4.5.4
  http: ^1.6.0
  shared_preferences: ^2.5.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  file_picker: ^13.3.2
  firebase_remote_config: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700  